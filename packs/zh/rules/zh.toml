[[decomposition_patterns]]
id = "directional-complement"
lemma_regex = '^(?P<base>.+?)(?P<complement>出来|出來|进去|進去|进来|進來|起来|起來|下去|下来|下來|上去|上来|上來|回去|回来|回來)$'
pos = ["verb", "verb phrase"]
reason = "productive Chinese verb-plus-directional-complement expression"
examples = ["拿出来", "走进去", "想起来"]

[[decomposition_patterns.components]]
group = "base"
role = "lexical-base"
pos = ["verb"]

[[decomposition_patterns.components]]
group = "complement"
role = "directional-complement"
pos = ["complement", "verb"]

[[non_learning_patterns]]
id = "number-common-classifier"
lemma_regex = '^(?:第)?[零〇一二两兩三四五六七八九十百千万萬亿億兆几幾0-9０-９]+(?:个|個|本|位|名|家|户|戶|所|间|間|层|層|张|張|片|枚|块|塊|段|条|條|道|只|隻|头|頭|匹|艘|辆|輛|台|部|件|份|套|双|雙|对|對|把|支|根|瓶|杯|碗|盘|盤|盆|盒|箱|包|袋|封|册|冊|卷|章|篇|首|门|門|节|節|课|課|题|題|项|項|种|種|样|樣|回|次|遍|趟|场|場|期|届|屆|级|級)$'
reason = "productive Chinese number-plus-classifier expression"
examples = ["一个", "十几个", "第二份", "第一次", "第二次", "2個"]

[[non_learning_patterns]]
id = "number-classifier"
lemma_regex = '^(?:第)?[零〇一二两兩三四五六七八九十百千万萬亿億兆几幾0-9０-９]+.+$'
pos = ["quantifier", "numeral phrase", "classifier phrase", "measure phrase"]
reason = "productive Chinese number-plus-classifier expression"
examples = ["一个", "两个", "几张", "第二份", "第一次", "第二次", "2個"]

[[non_learning_patterns]]
id = "number-measure-noun"
lemma_regex = '^(?:第)?[零〇一二两兩三四五六七八九十百千万萬亿億兆几幾0-9０-９]+(?:秒(?:钟|鐘)?|分(?:钟|鐘)?|小时|小時|天|日|夜|周|週|月|季|年|岁|歲|层|層|楼|樓|步|米|里|斤|克|吨|噸|升|倍)$'
reason = "productive Chinese number-plus-measure expression"
examples = ["四十五分", "三天", "两周", "十分钟", "一楼"]

[[non_learning_patterns]]
id = "determiner-classifier"
lemma_regex = '^(?:(?:这|這|那|哪|每|某|各)(?:个|個|本|位|名|家|户|戶|所|间|間|层|層|张|張|片|枚|块|塊|段|条|條|道|只|隻|头|頭|匹|艘|辆|輛|台|部|件|份|套|双|雙|对|對|把|支|根|瓶|杯|碗|盘|盤|盆|盒|箱|包|袋|封|册|冊|卷|章|篇|首|门|門|节|節|课|課|题|題|项|項|种|種|样|樣|回|次|遍|趟|场|場|期|届|屆|级|級)(?:人)?|(?:每一|另一个|另一個|某个|某個|各个|各個))$'
pos = ["determiner", "pronoun", "noun", "quantifier"]
reason = "productive Chinese determiner-plus-classifier expression"
examples = ["这个", "每个", "每个人", "这次", "这种", "另一个"]

[[lemma_conventions]]
id = "dictionary-headword"
guidance = "Use the dictionary headword, not an inflected phrase or a span containing aspect particles, complements, or prepositions."
