[project]
name = "lang-reader"
version = "0.2.0"
description = "A local language-learning reader with model-generated, validated lessons"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "jinja2>=3.1",
  "pydantic>=2.10",
  "sqlalchemy>=2.0",
  "tomli>=2.0; python_version < '3.11'",
  "uvicorn[standard]>=0.34",
]

[project.scripts]
lang = "server.cli:main"

[dependency-groups]
dev = [
  "httpx>=0.28",
  "mypy>=1.15",
  "pytest>=8.3",
  "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["extras/tts-qwen"]
